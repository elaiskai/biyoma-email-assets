<!--
BIYOMA · Signup popup mockup (minimal v2 with hero image)
Trigger: 30 sec delay from page load
Welcome #1 delivers actual code
-->
<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BIYOMA signup popup · minimal</title>
<style>
  body { margin:0; padding:0; background:#5d3ba5; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:Arial,Helvetica,sans-serif; }
  .backdrop { position:fixed; inset:0; background:rgba(40,20,80,0.55); display:flex; align-items:center; justify-content:center; padding:20px; }
  .popup {
    background:#ffffff; border-radius:10px; max-width:420px; width:100%;
    overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,0.3);
    position:relative;
  }
  .close { position:absolute; top:12px; right:16px; font-size:26px; color:#fff; cursor:pointer; line-height:1; z-index:2; text-shadow:0 1px 4px rgba(0,0,0,0.4); }
  .hero { display:block; width:100%; height:auto; }
  .content { padding:28px 32px 26px; text-align:center; }
  .eyebrow {
    font-size:10px; font-weight:700; letter-spacing:3px;
    color:#5d3ba5; text-transform:uppercase; margin-bottom:12px;
  }
  .headline {
    font-family:Arial,Helvetica,sans-serif; font-size:22px; font-weight:800;
    color:#111111; line-height:1.25; letter-spacing:-0.01em; margin-bottom:8px;
  }
  .subline {
    font-size:14px; line-height:1.5; color:#666666; margin-bottom:22px;
  }
  .email-input {
    width:100%; box-sizing:border-box; padding:14px 16px; font-size:15px;
    border:1px solid #e0e0e0; border-radius:6px; font-family:inherit;
    color:#111; outline:none; text-align:center; margin-bottom:10px;
  }
  .email-input:focus { border-color:#5d3ba5; }
  .cta {
    display:block; width:100%; box-sizing:border-box; padding:15px;
    background:#e8345e; color:#ffffff; font-size:13px; font-weight:800;
    letter-spacing:2px; text-transform:uppercase; border:none; border-radius:6px;
    cursor:pointer; margin-bottom:14px;
  }
  .cta:hover { background:#d12952; }
  .trust { font-size:10px; color:#999999; line-height:1.5; }
</style>
</head>
<body>

<div class="backdrop">
  <div class="popup">
    <div class="close">×</div>

    <img class="hero" src="https://cdn.jsdelivr.net/gh/elaiskai/biyoma-email-assets@main/forms/popup-hero.jpg?v=4" alt="BIYOMA Sleep Max">

    <div class="content">
      <div class="eyebrow">-15% pirmajam užsakymui</div>
      <div class="headline">Pradėk savo BIYOMA rutiną</div>
      <div class="subline">Palik el. paštą - nuolaidą atsiųsim per 5 min.</div>

      <input type="email" class="email-input" placeholder="Tavo el. paštas">

      <button class="cta">Gauti nuolaidą</button>

      <div class="trust">Nemokamas pristatymas nuo 50€ · Atsisakyti gali bet kada</div>
    </div>
  </div>
</div>

</body>
</html>
